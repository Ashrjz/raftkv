syntax = "proto3";

package kv.v1;

option go_package = "github.com/Ashrjz/raftkv/proto/kvpb;kvpb";

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}

// Admin operations are explicit, operator-triggered calls.
service Admin {
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);
}

message GetRequest { string key = 1; }

// A missing key is reported as status NotFound, not in the message.
message GetResponse {
  bytes value = 1;
}

message PutRequest { string key = 1; bytes value = 2; }
message PutResponse {}

message DeleteRequest { string key = 1; }
message DeleteResponse {}

message SnapshotRequest {}
message SnapshotResponse {}